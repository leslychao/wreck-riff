name: Verify Windows MVP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clean checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Microsoft JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: microsoft
          java-version: '21.0.11'
          architecture: x64
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Verify logic, native physics, and assets
        run: .\gradlew.bat clean test physicsTest verifyAssets --no-daemon --console=plain --continue

      - name: Build Windows app-image and ZIP
        run: .\gradlew.bat packageWindows --no-daemon --console=plain

      # A hosted runner is not evidence of a usable interactive GPU/audio session.
      # Real-window smoke, physical gamepad, and owner review remain local gates.
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-reports-${{ github.sha }}
          path: |
            build/test-results/
            build/reports/
            build/distributions/WreckRiff/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Windows package
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WreckRiff-windows-x64-${{ github.sha }}
          path: |
            build/distributions/WreckRiff-*-windows-x64.zip
            build/distributions/WreckRiff-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
